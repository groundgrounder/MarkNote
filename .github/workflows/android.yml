name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 原来用的是 android-actions/setup-android@v3，它在 2026-09-15 上游坏掉了：
      # 该 action 固定会执行 `sdkmanager tools`，而 `tools` 包已被 Google 的 SDK 仓库移除，
      # 于是报 "Warning: Failed to find package 'tools'" 并以退出码 1 结束整个步骤
      # （实测 main / tag 两次构建都在这里 17~26 秒内挂掉，与项目代码无关）。
      # runner 镜像本来就带 Android SDK、licenses 也已接受，所以改成只补装本项目需要的那几个包。
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          test -d "$SDK" || { echo "::error::找不到 Android SDK 目录: $SDK"; exit 1; }
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35"

      # 默认的 debug 签名是 AGP 在 ~/.android/debug.keystore 不存在时**现场随机生成**的，
      # CI 每次在全新 runner 上都会换一把钥匙 —— 于是每个 Release 包签名都不同，用户覆盖
      # 安装会被系统拒绝（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。这里把固定密钥从仓库
      # secret 还原出来；`app/build.gradle.kts` 见到 keystore/marknote.jks 就会用它签名。
      - name: 还原打包密钥
        env:
          KS_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KS_BASE64" | base64 -d > keystore/marknote.jks
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::缺少 secrets.SIGNING_KEYSTORE_BASE64：这样签出的包用户无法覆盖安装"
            exit 1
          fi

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 上面那道「密钥必须还原」的门禁挡不住「还原了但构建没用上」的情况，所以再核一次证书，
      # 免得哪天又悄悄退回随机签名（那正是 v0.8 → v1.0 → v1.1 全都装不上的原因）。
      - name: 校验签名确为固定密钥
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"
          CERT="$("$BT/apksigner" verify --print-certs "$APK" \
                | grep -oE 'SHA-256 digest: [0-9a-f]+' | tail -1 | awk '{print $3}')"
          echo "签名证书 SHA-256: ${CERT:-（取不到）}"
          if [ "$CERT" != "c35357174c91412d1f8a9739ef815eceb88b520ae3fcd6244c609a6b0580b20d" ]; then
            echo "::error::签名证书不是固定密钥，这样发出的包用户无法覆盖安装"
            exit 1
          fi

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: marknote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # 仅打 v* tag 时发 Release，附带 APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marknote-debug-apk

      - name: 重命名为带版本号的文件名
        run: mv app-debug.apk "MarkNote-${{ github.ref_name }}.apk"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: "MarkNote-${{ github.ref_name }}.apk"
          generate_release_notes: true
